apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/omerkisa1/monolith-to-microservice
    targetRevision: omer-dev
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: storefront

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
